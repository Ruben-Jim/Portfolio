<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    Share this link (not /linktree) when offering a custom Link Tree to a
    business: link previews show the "Your brand's link in bio" card (its
    prices are kept current by scripts/sync-prices.mjs), then visitors land on /linktree as the live example.
  -->
  <title data-price-template="Custom Link Tree for your business — from {pkg_linktree} | CodeWithRuben">Custom Link Tree for your business — from $99 | CodeWithRuben</title>
  <meta name="description" content="A branded link-in-bio page for Instagram &amp; TikTok — book, call, menu and reviews in one link. Live example by CodeWithRuben, Fresno." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://rubenjimenez.dev/linktree" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rubenjimenez.dev/link-in-bio" />
  <meta property="og:site_name" content="CodeWithRuben" />
  <meta property="og:title" content="Your brand’s link in bio — Custom Link Tree from $99" data-price-template="Your brand’s link in bio — Custom Link Tree from {pkg_linktree}" data-price-attr="content" />
  <meta property="og:description" content="Book, call, menu and reviews in one branded link for Instagram &amp; TikTok. Tap to see a live example." />
  <meta property="og:image" content="https://rubenjimenez.dev/assets/images/og/link-in-bio.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:alt" content="Custom Link Tree by CodeWithRuben — from $99" data-price-template="Custom Link Tree by CodeWithRuben — from {pkg_linktree}" data-price-attr="content" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Your brand’s link in bio — Custom Link Tree from $99" data-price-template="Your brand’s link in bio — Custom Link Tree from {pkg_linktree}" data-price-attr="content" />
  <meta name="twitter:description" content="Book, call, menu and reviews in one branded link for Instagram &amp; TikTok. Tap to see a live example." />
  <meta name="twitter:image" content="https://rubenjimenez.dev/assets/images/og/link-in-bio.jpg" />

  <!-- People go straight to the live example; link-preview bots read the tags above. -->
  <meta http-equiv="refresh" content="0; url=/linktree?ref=link-in-bio" />
  <script>location.replace('/linktree?ref=link-in-bio');</script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090e; color: #f4f7fb; font-family: Poppins, system-ui, sans-serif; }
    a { color: #ffdb6e; }
  </style>
</head>
<body>
  <p>Opening the example… <a href="/linktree?ref=link-in-bio">Tap here if it doesn’t open.</a></p>
</body>
</html>
