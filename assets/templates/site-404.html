<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/">
  <title>Page not found | CodeWithRuben</title>
  <meta name="title" content="Page not found | CodeWithRuben">
  <meta name="description" content="That page isn’t on CodeWithRuben. Head home, contact the studio, or start a project.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ceb15a">
  <link rel="canonical" href="https://rubenjimenez.dev/">
  <link rel="shortcut icon" href="/assets/images/logo/logo.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f10;
      --panel: #1a1a1c;
      --jet: #2a2a2e;
      --gold: #ceb15a;
      --gold-soft: rgba(206, 177, 90, 0.18);
      --text: #fafafa;
      --muted: #b0b0b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Poppins, system-ui, sans-serif;
      background:
        radial-gradient(ellipse 90% 60% at 50% -10%, var(--gold-soft), transparent 55%),
        var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 24px 20px 32px;
    }
    .wrap {
      width: min(640px, 100%);
      margin: auto;
      text-align: center;
    }
    .brand {
      display: inline-block;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
    }
    .brand span { color: var(--gold); }
    .code {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin: 0 0 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      line-height: 1.2;
      font-weight: 700;
    }
    .lead {
      margin: 0 auto 1.75rem;
      max-width: 36ch;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid var(--jet);
      background: var(--panel);
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .btn:hover { border-color: var(--gold); }
    .btn-primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #141414;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .legal {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .legal a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .legal a:hover { color: var(--gold); }
    .sep { margin: 0 0.35rem; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="brand" href="/">CodeWith<span>Ruben</span></a>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p class="lead">That link doesn’t match anything on this site. Try home, reach out, or start a project brief.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Home</a>
      <a class="btn" href="/contact/">Contact</a>
      <a class="btn" href="/hire-me/">Start a project</a>
    </div>
    <p class="legal">
      <a href="/privacy/">Privacy</a><span class="sep">·</span>
      <a href="/terms/">Terms</a><span class="sep">·</span>
      <a href="/cookies/">Cookies</a>
    </p>
  </div>
</body>
</html>
