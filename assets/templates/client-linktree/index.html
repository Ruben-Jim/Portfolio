<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valley Green Lawn Care — Links</title>
  <meta name="description" content="Book lawn care, get a quote, or follow Valley Green Lawn Care." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Client theme — swap these per brand ── */
    :root {
      --bg: #0f1a12;
      --bg-accent: #162318;
      --text: #f4f7f4;
      --text-muted: rgba(244, 247, 244, 0.68);
      --brand: #6fbf73;
      --brand-soft: rgba(111, 191, 115, 0.14);
      --link-bg: rgba(255, 255, 255, 0.06);
      --link-bg-hover: rgba(255, 255, 255, 0.11);
      --link-border: rgba(255, 255, 255, 0.1);
      --radius: 14px;
      --ff: 'DM Sans', system-ui, sans-serif;
      --max: 420px;
      --ease: 0.22s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--ff);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--brand-soft), transparent 55%),
        linear-gradient(180deg, var(--bg-accent), var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 28px 18px 40px;
    }

    .page {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      animation: rise 0.45s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .profile {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      margin: 0 auto 14px;
      overflow: hidden;
      border: 2px solid var(--brand);
      box-shadow: 0 0 0 6px var(--brand-soft);
      background: var(--link-bg);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 0.02em;
    }

    .name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 34ch;
      margin: 0 auto;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 18px 0 0;
      list-style: none;
    }

    .socials a {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--link-bg);
      border: 1px solid var(--link-border);
      transition: background var(--ease), transform var(--ease), border-color var(--ease);
    }

    .socials a:hover,
    .socials a:focus-visible {
      background: var(--link-bg-hover);
      border-color: var(--brand);
      transform: translateY(-1px);
      outline: none;
    }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      list-style: none;
    }

    .links a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--link-bg);
      border: 1px solid var(--link-border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background var(--ease), border-color var(--ease), transform var(--ease);
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--link-bg-hover);
      border-color: var(--brand);
      transform: translateY(-1px);
      outline: none;
    }

    .links a:active {
      transform: translateY(0) scale(0.99);
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: var(--brand-soft);
      color: var(--brand);
    }

    .link-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .link-label {
      flex: 1;
      text-align: left;
    }

    .link-arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
      line-height: 1;
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .footer a {
      color: var(--brand);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      .page { animation: none; }
      .links a,
      .socials a { transition: none; }
    }
  </style>
</head>
<body>
