<!doctype html>
<!--
  Print page for client guide PDFs. scripts/build-guide-pdfs.mjs opens it on a
  local server, calls renderGuide(), then prints it to PDF. Not published
  (scripts/ stays private). Editing this file rebuilds every guide PDF.

  Looks like the guide in the client portal: it loads the portal's own
  stylesheets (client-portal.css for the colors and Poppins, portfolio-markdown.css
  for the guide), so a style change there reaches the PDFs on the next build.
  PDF-only rules below: dark page edge to edge, page numbers, each "Step"
  starts a page, screenshots larger than the portal's tap-to-zoom thumbnails.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Guide</title>
  <link rel="stylesheet" href="/assets/css/client-portal.css">
  <link rel="stylesheet" href="/assets/css/portfolio-markdown.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* The guide window's color (.portal-guide-sheet), painted into the page margins too. */
    @page {
      size: Letter;
      margin: 0.6in 0.65in 0.75in;
      background: var(--eerie-black-2, hsl(240, 2%, 12%));
      @bottom-right {
        content: counter(page) " / " counter(pages);
        font: 8pt 'Poppins', sans-serif;
        color: hsla(0, 0%, 84%, 0.6);
      }
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; background: var(--eerie-black-2); }
    body { font-family: var(--ff-poppins); }

    /* The portal shows the guide's title in gold above it (and hides this H1); the PDF keeps the H1, in gold. */
    .portfolio-markdown .portfolio-md-doc-title { color: var(--orange-yellow-crayola); }

    .portfolio-markdown {
      /* No tap-to-zoom in a PDF: screenshots read at full size. */
      --md-screenshot-max-width: 460px;
    }
    .portfolio-md-figure img,
    .portfolio-md-inline-img {
      width: auto;
      max-height: 4.2in;
      box-shadow: none;
    }

    /* One step per page; nothing splits across a page edge. */
    .pdf-step-start { break-before: page; }
    .portfolio-markdown > .pdf-step-start { margin-top: 0; }
    h1, h2, h3 { break-after: avoid; }
    .portfolio-md-figure,
    .portfolio-md-table-wrap,
    .portfolio-md-callout,
    .portfolio-markdown pre,
    .portfolio-md-list li { break-inside: avoid; }
    .portfolio-md-figure-video { display: none; }
  </style>
</head>
<body>
  <main id="guide"></main>
  <script src="/assets/js/portfolio-detail-shared.js"></script>
  <script>
    var PAGE_BG = '#1e1e1f';

    /** JPEG keeps a screenshot-heavy guide a few MB instead of tens (Chrome embeds JPEG as-is). */
    function toJpeg(img) {
      var w = Math.min(img.naturalWidth || 0, 1400);
      if (!w) return;
      var h = Math.round((img.naturalHeight / img.naturalWidth) * w);
      var c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      var ctx = c.getContext('2d');
      ctx.fillStyle = PAGE_BG;
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      img.src = c.toDataURL('image/jpeg', 0.82);
    }

    function cssString(s) {
      return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ') + '"';
    }

    /** Renders one language of a guide; resolves with its title once every image and font is in. */
    window.renderGuide = async function (mdUrl, lang) {
      var S = window.PortfolioDetailShared;
      var md = await (await fetch(mdUrl)).text();
      var split = S.splitMarkdownByLang(md);
      var part = lang ? split.parts.filter(function (p) { return p.lang === lang; })[0] : null;
      var text = part ? split.preamble + '\n' + part.text : md;
      var main = document.getElementById('guide');
      if (lang) document.documentElement.lang = lang;
      // Same wrapper the portal puts around a guide (renderLocalizedMarkdownHtml).
      main.innerHTML = '<div class="project-detail-canvas-md portfolio-markdown">' + S.renderMarkdownToHtml(text, mdUrl) + '</div>';

      // "## Step 1" / "## Paso 1" and "### Step 1" (the renderer's step sections) each start a page.
      Array.prototype.forEach.call(main.querySelectorAll('.portfolio-markdown > h2, .portfolio-md-step'), function (el) {
        if (el.classList.contains('portfolio-md-step') || /^(Step|Paso) \d+/i.test(el.textContent.trim())) el.classList.add('pdf-step-start');
      });

      var imgs = Array.prototype.slice.call(main.querySelectorAll('img'));
      await Promise.all(imgs.map(function (img) {
        img.loading = 'eager';
        return img.decode().catch(function () {});
      }));
      var broken = imgs.filter(function (i) { return !i.naturalWidth; });
      broken.forEach(function (i) {
        var fig = i.closest('figure');
        (fig || i).remove();
      });
      imgs = imgs.filter(function (i) { return i.naturalWidth; });
      imgs.forEach(toJpeg);
      await Promise.all(imgs.map(function (img) { return img.decode().catch(function () {}); }));

      var h1 = main.querySelector('h1');
      document.title = (h1 ? h1.textContent : 'Guide').trim();
      var footer = document.createElement('style');
      footer.textContent = '@page { @bottom-left { content: ' + cssString(document.title + ' · CodeWithRuben') +
        "; font: 8pt 'Poppins', sans-serif; color: hsla(0, 0%, 84%, 0.6); } }";
      document.head.appendChild(footer);
      await document.fonts.ready;
      return { title: document.title, images: imgs.length, broken: broken.map(function (i) { return i.getAttribute('alt') || i.getAttribute('src'); }) };
    };
  </script>
</body>
</html>
