<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks for your order | CodeWithRuben</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #07090e; --panel: #0e1118; --line: rgba(255,255,255,.09); --text: #f4f7fb; --muted: #9aa3b2; --gold: hsl(45, 54%, 58%); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Poppins, system-ui, sans-serif; color: var(--text); background: var(--bg); background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px); background-size: 22px 22px; }
    .card { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 36px 28px; text-align: center; }
    .icon { font-size: 44px; line-height: 1; }
    h1 { font-size: 30px; line-height: 1.15; margin: 16px 0 10px; letter-spacing: -0.02em; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
    b { color: var(--text); }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font: 600 15px Poppins, sans-serif; text-decoration: none; margin-top: 12px; }
    .btn-gold { background: var(--gold); color: #12100a; }
    .btn-ghost { border: 1px solid var(--line); color: var(--text); margin-left: 8px; }
  </style>
  <!-- Test mode: admin only (kits-gate.js). These three load first so the page hides before it paints. -->
  <script src="/assets/js/config.js?v=reviews-tab-20261020"></script>
  <script src="/assets/js/kits-catalog.js?v=gate1-20261125"></script>
  <script src="/assets/js/kits-gate.js?v=gate1-20261125"></script>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="icon" data-icon>⏳</div>
    <h1 data-title>Checking your payment…</h1>
    <p data-body>One moment.</p>
    <div data-actions></div>
  </main>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    // Kit names, pages and the publishable key come from assets/js/kits-catalog.js.
    var STRIPE_PUBLISHABLE_KEY = window.CWR_KITS.stripePublishableKey;

    (function () {
      var q = new URLSearchParams(location.search);
      var kit = window.CWR_KITS.get(q.get('kit')) || { name: 'your kit', page: '/' };
      var $ = function (s) { return document.querySelector(s); };
      function show(icon, title, body, actionsHtml) {
        $('[data-icon]').textContent = icon;
        $('[data-title]').textContent = title;
        $('[data-body]').innerHTML = body;
        $('[data-actions]').innerHTML = actionsHtml || '';
      }
      var home = '<a class="btn btn-ghost" href="/">Home</a>';
      var retry = '<a class="btn btn-gold" href="/kits/checkout?kit=' + encodeURIComponent(q.get('kit') || '') + '">Try again</a>';

      var secret = q.get('payment_intent_client_secret');
      if (!secret || !STRIPE_PUBLISHABLE_KEY || typeof Stripe === 'undefined') {
        if (q.get('redirect_status') === 'succeeded') {
          return show('🎉', "You're in!", 'Thanks for buying <b>' + kit.name + '</b>. Check your email for the link to accept your GitHub invite.', home);
        }
        return show('🤔', 'No order found', 'If you just paid, check your email for your receipt and GitHub invite.', retry + home);
      }

      Stripe(STRIPE_PUBLISHABLE_KEY).retrievePaymentIntent(secret).then(function (r) {
        var pi = r.paymentIntent;
        var status = pi && pi.status;
        if (status === 'succeeded') {
          var email = pi.receipt_email ? ' (<b>' + pi.receipt_email.replace(/[<>&"]/g, '') + '</b>)' : '';
          show('🎉', "You're in!",
            'Thanks for buying <b>' + kit.name + '</b>. We\'re sending a GitHub invite to the private repo and an email' + email + ' with the link to accept it. It usually arrives within a minute.',
            '<a class="btn btn-gold" href="https://github.com/notifications" target="_blank" rel="noopener">Open GitHub</a>' + home);
        } else if (status === 'processing') {
          show('⏳', 'Payment processing', "Your payment is still processing. You'll get an email with your GitHub invite as soon as it goes through.", home);
        } else {
          show('⚠️', "Payment didn't go through", 'Nothing was charged. Try again with a different card or payment method.', retry + home);
        }
      }).catch(function () {
        show('🤔', "Couldn't check the payment", 'If you paid, your receipt and GitHub invite will arrive by email.', home);
      });
    })();
  </script>
</body>
</html>
