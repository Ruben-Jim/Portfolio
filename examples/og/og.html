<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CWR link previews (1200×630)</title>
<!--
  Link-preview cards (og:image) in the 3×1 grid banner's look.
  One page, one card per ?card=: home, linktree, link-in-bio, services, portfolio, hire-me.
  Export all: ./examples/og/export-og.sh  →  assets/images/og/<card>.jpg
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #07090e;
    --gold: #ffdb6e;
    --gold-2: #ffbc5e;
    --white: #f4f7fb;
    --soft: #aeb5c5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--navy); }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Poppins, system-ui, sans-serif; color: var(--white); }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--navy); }

  /* Tilted wall of real client builds (same as the grid banner, scaled). */
  .wall {
    position: absolute; left: -260px; top: -320px; width: 2000px;
    display: grid; grid-template-columns: repeat(6, 300px); gap: 20px;
    transform: rotate(-9deg);
  }
  .wall img {
    display: block; width: 300px; height: 188px; object-fit: cover; object-position: top;
    border-radius: 12px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
  }
  .shade {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 62% at 35% 50%, rgba(7, 9, 14, 0.92), rgba(7, 9, 14, 0.5) 80%),
      linear-gradient(180deg, rgba(7, 9, 14, 0.35), rgba(7, 9, 14, 0.7));
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 50% 45% at 30% 0%, rgba(255, 219, 110, 0.16), transparent 70%); }

  .content { position: absolute; inset: 0; padding: 64px 70px; display: flex; flex-direction: column; justify-content: center; }
  .brandline { display: flex; align-items: center; gap: 18px; margin-bottom: 26px; }
  .logo { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255, 219, 110, 0.18); }
  .wordmark { font-weight: 800; font-size: 34px; letter-spacing: -0.03em; }
  .wordmark span, .gold {
    background: linear-gradient(135deg, var(--gold), var(--gold-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .kicker { font-size: 15px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-top: 2px; }
  h1 { margin: 0; font-size: 62px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; max-width: 640px; }
  .sub { margin-top: 20px; font-size: 24px; font-weight: 600; color: var(--soft); max-width: 600px; line-height: 1.35; }
  .sub i { font-style: normal; color: var(--gold); margin: 0 8px; }
  .pill {
    display: inline-block; margin-top: 30px; padding: 12px 30px; border-radius: 999px;
    background: linear-gradient(135deg, var(--gold), var(--gold-2)); color: #1a1204;
    font-size: 28px; font-weight: 800; letter-spacing: -0.02em; box-shadow: 0 14px 40px rgba(255, 188, 94, 0.28);
    width: fit-content;
  }
  .url { position: absolute; left: 70px; bottom: 34px; font-size: 18px; font-weight: 600; color: var(--soft); letter-spacing: 0.02em; }

  /* Phone with the real link page */
  .phone {
    position: absolute; right: 90px; top: 50%; transform: translateY(-50%) rotate(4deg);
    width: 268px; height: 560px; padding: 10px; border-radius: 42px;
    background: #111522; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12), 0 40px 90px rgba(0, 0, 0, 0.65), 0 0 0 10px rgba(255, 219, 110, 0.06);
  }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 33px; }

  /* Price cards (services) */
  .prices { position: absolute; right: 64px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 16px; width: 360px; }
  .price-card {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px 24px; border-radius: 18px; background: rgba(17, 21, 34, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  }
  .price-card.hot { border-color: rgba(255, 219, 110, 0.6); box-shadow: 0 18px 40px rgba(255, 188, 94, 0.18); }
  .price-card b { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; }
  .price-card.hot b { color: var(--gold); }
  .price-card span { font-size: 18px; font-weight: 600; color: var(--soft); text-align: right; line-height: 1.25; }
  .price-card em { display: block; font-style: normal; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }

  /* Centered layouts (home, portfolio, hire-me) */
  .center .content { align-items: center; text-align: center; }
  .center h1, .center .sub { max-width: 980px; }
  .center .shade {
    background:
      radial-gradient(ellipse 72% 62% at 50% 50%, rgba(7, 9, 14, 0.9), rgba(7, 9, 14, 0.45) 82%),
      linear-gradient(180deg, rgba(7, 9, 14, 0.3), rgba(7, 9, 14, 0.66));
  }
  .center .glow { background: radial-gradient(ellipse 50% 45% at 50% 0%, rgba(255, 219, 110, 0.18), transparent 70%); }
  .center .url { left: 0; right: 0; text-align: center; }
  .hero-brand { display: flex; align-items: center; gap: 26px; }
  .hero-brand .logo { width: 132px; height: 132px; box-shadow: 0 0 0 6px rgba(255, 219, 110, 0.18), 0 20px 60px rgba(0, 0, 0, 0.6); }
  .hero-brand .wordmark { font-size: 96px; letter-spacing: -0.045em; line-height: 0.95; }
  .hero-brand .kicker { font-size: 20px; margin-top: 10px; }
  .chips { display: flex; gap: 14px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }
  .chip { padding: 10px 20px; border-radius: 999px; background: rgba(17, 21, 34, 0.85); border: 1px solid rgba(255, 255, 255, 0.14); font-size: 20px; font-weight: 700; }

  /* Home: same layout as the 3×1 banner (examples/instagram/grid-banner.html) */
  .banner-brand { display: flex; align-items: center; gap: 30px; }
  .banner-brand .logo { width: 190px; height: 190px; box-shadow: 0 0 0 5px rgba(255, 219, 110, 0.18), 0 16px 46px rgba(0, 0, 0, 0.6); }
  .banner-brand .wordmark { font-size: 112px; letter-spacing: -0.045em; line-height: 0.9; white-space: nowrap; text-align: left; }
  .banner-brand .kicker { margin-top: 16px; font-size: 24px; letter-spacing: 0.2em; text-align: left; }
  .banner-sell { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 44px; width: 100%; }
  .banner-sell .offer { font-size: 35px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .banner-sell .offer i { font-style: normal; color: var(--gold); margin: 0 10px; }
  .banner-sell .price {
    padding: 10px 28px; border-radius: 999px; background: linear-gradient(135deg, var(--gold), var(--gold-2));
    color: #1a1204; font-size: 36px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap;
    box-shadow: 0 12px 34px rgba(255, 188, 94, 0.28);
  }
  .avatar { width: 118px; height: 118px; border-radius: 50%; border: 4px solid var(--gold); background: #1a1f2e; object-fit: cover; margin-bottom: 22px; box-shadow: 0 16px 40px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  var LOGO = '../../assets/images/logo/logo.jpg';
  var AVATAR = '../../assets/images/avatar/my-avatar.png';
  var PHONE = 'captures/linktree-phone.png';
  var ids = ['procleaning', 'rizo', 'barbershop', 'zoomrealty', 'rosasalon', 'tradeservice', 'homeverse', 'hoa', 'estate', 'grippysocks'];

  function wall() {
    var html = '';
    for (var i = 0; i < 36; i++) html += '<img src="../instagram/captures/' + ids[(i * 7) % ids.length] + '/laptop.png" alt="">';
    return '<div class="wall">' + html + '</div><div class="shade"></div><div class="glow"></div>';
  }
  function brandline() {
    return '<div class="brandline"><img class="logo" src="' + LOGO + '" alt=""><div>' +
      '<div class="wordmark">CodeWith<span>Ruben</span></div>' +
      '<div class="kicker">Web &amp; Mobile Dev Studio · Fresno</div></div></div>';
  }

  var CARDS = {
    // Main site — the 3×1 grid banner's layout, scaled to 1200×630.
    home: { center: true, html:
      '<div class="banner-brand"><img class="logo" src="' + LOGO + '" alt=""><div>' +
      '<div class="wordmark">CodeWith<span>Ruben</span></div>' +
      '<div class="kicker">Web &amp; Mobile Dev Studio · Fresno</div></div></div>' +
      '<div class="banner-sell"><div class="offer">Websites <i>·</i> Staff apps <i>·</i> Admin dashboards</div>' +
      '<div class="price">Starting at $499</div></div>' },

    // Personal link page — what you send people who want your links.
    linktree: { html:
      '<img class="avatar" src="' + AVATAR + '" alt="">' +
      '<h1>All my links,<br><span class="gold">one tap away</span></h1>' +
      '<div class="sub">Start a project <i>·</i> Pricing <i>·</i> Reviews</div>' +
      '<div class="url">rubenjimenez.dev/linktree · CodeWithRuben</div>' +
      '<div class="phone"><img src="' + PHONE + '" alt=""></div>' },

    // Link Tree as a service — what businesses see when you offer one.
    'link-in-bio': { html:
      brandline() +
      '<h1>Your brand’s<br><span class="gold">link in bio</span></h1>' +
      '<div class="sub">Book <i>·</i> Call <i>·</i> Menu <i>·</i> Reviews — one branded link for Instagram &amp; TikTok</div>' +
      '<div class="pill">Custom Link Tree · from $99</div>' +
      '<div class="phone"><img src="' + PHONE + '" alt=""></div>' },

    services: { html:
      brandline() +
      '<h1>What you<br><span class="gold">actually get</span></h1>' +
      '<div class="sub">Fixed-price packages · first month of care included · care plans from $44/mo</div>' +
      '<div class="prices">' +
      '<div class="price-card"><b>$499</b><span>Website<br>1 page + admin</span></div>' +
      '<div class="price-card"><b>$1,500</b><span>Website + app<br>iOS &amp; Android</span></div>' +
      '<div class="price-card hot"><b>$3,500</b><span><em>Most popular</em>Full platform</span></div>' +
      '</div>' +
      '<div class="url">rubenjimenez.dev/services-pricing</div>' },

    portfolio: { center: true, html:
      brandline().replace('class="brandline"', 'class="brandline" style="justify-content:center"') +
      '<h1>Apps &amp; sites <span class="gold">we’ve built</span></h1>' +
      '<div class="sub">Live client work and ready-to-brand templates — web, iOS and Android</div>' +
      '<div class="chips"><span class="chip">ProCleaning</span><span class="chip">Rizo Pizzeria</span><span class="chip">Shelton Springs HOA</span><span class="chip">+ more</span></div>' +
      '<div class="url">rubenjimenez.dev/portfolio</div>' },

    'hire-me': { center: true, html:
      brandline().replace('class="brandline"', 'class="brandline" style="justify-content:center"') +
      '<h1>Let’s build <span class="gold">your next app</span></h1>' +
      '<div class="sub">Tell me about your business — I reply within 24 hours</div>' +
      '<div class="pill">Start a project →</div>' +
      '<div class="url">rubenjimenez.dev/hire-me</div>' }
  };

  var name = new URLSearchParams(location.search).get('card') || 'home';
  var c = CARDS[name] || CARDS.home;
  var card = document.getElementById('card');
  if (c.center) card.classList.add('center');
  card.innerHTML = wall() + '<div class="content">' + c.html + '</div>';
</script>
</body>
</html>
